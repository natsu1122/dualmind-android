name: Android
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**/*.md', 'NOTICE', 'LICENSE']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Test, lint and build development APK
        run: ./gradlew :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Verify development signature and checksum
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          cd app/build/outputs/apk/debug
          sha256sum app-debug.apk > app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: dualmind-development-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            core/build/reports/tests/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          retention-days: 14
